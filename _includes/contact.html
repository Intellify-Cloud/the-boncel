  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext.contact.title | markdownify | default: "Contact Us" }}</h2>

      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 text-center contact-actions">
        <p>Brad Burczak</p>
        <p><a href="tel:+27846866089">084 686 6089</a></p>
        <p><a href="mailto:{{ site.email }}?subject=The Bond Cellar Website Enquiry">{{ site.email }}</a></p>
      </div>
    </div>
  </div>
</section>
